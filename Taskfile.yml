version: '3'

tasks:
  start:
    desc: Reset and start a demo API; pass DEMO=demo1, for example
    dir: demo/{{.DEMO}}
    env:
      DEMO_TIMEOUT_AFTER_CREATE: '{{.TIMEOUT}}'
      DEMO_SLOT_CHECK_DELAY: '{{.SLOT_DELAY}}'
      DEMO_RATE_LIMIT: '{{.RATE_LIMIT}}'
      DEMO_RATE_LIMIT_WINDOW: '{{.RATE_WINDOW}}'
    cmds:
      - rm -f appointments.db
      - go run .

  query:
    desc: Query appointments; pass DEMO=demo1, for example
    dir: demo/{{.DEMO}}
    cmds:
      - sqlite3 appointments.db "SELECT * FROM appointments;"
