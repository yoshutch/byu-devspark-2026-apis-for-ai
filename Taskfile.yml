version: '3'

tasks:
  start:
    desc: Start the demo API
    dir: demo
    cmds:
      - go run .

  start:demo1:
    desc: Reset and start the Demo 1 API
    dir: demo/demo1
    cmds:
      - rm -f appointments.db
      - go run .

  start:demo2:
    desc: Reset and start the Demo 2 API
    dir: demo/demo2
    cmds:
      - rm -f appointments.db
      - go run .

  start:demo3:
    desc: Reset and start the Demo 3 API
    dir: demo/demo3
    cmds:
      - rm -f appointments.db
      - go run .

  clear-db:
    desc: Clear the demo SQLite database
    dir: demo
    cmds:
      - rm -f appointments.db

  query-appointments:
    desc: Query all appointments
    dir: demo
    cmds:
      - sqlite3 appointments.db "SELECT * FROM appointments;"
